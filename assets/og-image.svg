      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#08090f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b" cx="80%" cy="60%" r="45%">
